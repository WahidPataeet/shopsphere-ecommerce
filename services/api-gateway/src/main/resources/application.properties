spring.application.name=api-gateway

server.port=8080


# ==========================================
# AUTH SERVICE ROUTE
# ==========================================

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8085
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**


# ==========================================
# PRODUCT SERVICE ROUTE
# ==========================================

spring.cloud.gateway.server.webflux.routes[1].id=product-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/products/**


# ==========================================
# CORS
# ==========================================

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:4200
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true

# Important for CORS preflight requests
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true


# ==========================================
# ACTUATOR
# ==========================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


# ==========================================
# LOGGING
# ==========================================

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=INFO